# Mounted into the frontend container (see docker-compose.yml).
# Keeps /api/ and /s3/ proxy + upload limits across restarts without image rebuild.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 100m;
        proxy_request_buffering off;
    }

    # Presigned URLs are signed with Host from MINIO_PUBLIC_ENDPOINT (localhost:9000 in .env).
    # Forwarding $host (e.g. localhost:3000) breaks SigV4 and images/uploads appear broken.
    location /s3/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host localhost:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
